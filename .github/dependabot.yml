version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo SDK packages must move together; upgrade them with `expo install --fix`.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*']
      nest:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
