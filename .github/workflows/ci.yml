name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-e2e:
    name: API end-to-end (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: bgym
          POSTGRES_PASSWORD: bgym_ci_only
          POSTGRES_DB: bgym
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgym -d bgym"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bgym:bgym_ci_only@localhost:5432/bgym?schema=public
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bgym/shared build
      - run: pnpm --filter @bgym/api db:migrate
      - run: pnpm --filter @bgym/api db:seed
      - run: pnpm --filter @bgym/api test:e2e

  mobile-bundle:
    name: Mobile bundles (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bgym/shared build
      - name: Bundle with Metro (catches broken imports and native-module config)
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --platform android --output-dir /tmp/expo-export

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
