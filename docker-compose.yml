# Local development services. Not for production.
name: bgym
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: bgym
      POSTGRES_PASSWORD: bgym_local_dev_only
      POSTGRES_DB: bgym
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bgym -d bgym']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
