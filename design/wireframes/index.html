<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGYM Wireframes</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-latin-400-normal.woff2)}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-latin-500-normal.woff2)}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-latin-700-normal.woff2)}
@font-face{font-family:Outfit;font-weight:800;src:url(fonts/outfit-latin-800-normal.woff2)}
:root{--mid:#0D1028;--flare:#FF5A1F;--ember:#FF8A3D;--violet:#6C5CE7;--cloud:#F5F6FA;--line:#E6E8F0;--mute:#6B7280;--ok:#16A34A;--ph:#DDE0EA}
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--mid);background:#E9EBF2}
.board{padding:56px 56px 64px;width:max-content}
.board>h1{font-size:40px;margin:0 0 4px;font-weight:800}.board>h1 b{color:var(--flare)}
.board>p.sub{font-size:18px;color:var(--mute);margin:0 0 36px}
.row{display:flex;gap:34px;align-items:flex-start}
.cell{width:360px}.cell .lab{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.cell .lab span{display:inline-block;background:var(--mid);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px}
.cell .note code{background:#E2E5EF;border-radius:5px;padding:1px 5px;font-size:12.5px}
.cell .note{font-size:13.5px;color:var(--mute);line-height:1.45;margin-top:12px}
/* phone */
.phone{width:360px;height:760px;border-radius:46px;background:#0B0D1C;padding:10px;box-shadow:0 24px 50px rgba(13,16,40,.28)}
.scr{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--cloud);display:flex;flex-direction:column;font-size:14px}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.dark .sb{color:#fff}
.body{flex:1;overflow:hidden;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.tabbar{flex:none;height:70px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9AA0B4;font-weight:600}.tab.on{color:var(--flare)}
.tab svg{width:22px;height:22px}
.hdr{display:flex;align-items:center;justify-content:space-between}.hdr h2{margin:0;font-size:24px;font-weight:800}
.icons{display:flex;gap:10px}.ib{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.ib svg{width:19px;height:19px}.badge{position:absolute;top:-4px;right:-4px;background:var(--flare);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.ph{background:repeating-linear-gradient(45deg,#E3E6EF 0 10px,#DADDE8 10px 20px);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#8C92A8;font-size:12px;font-weight:600}
.btn{background:var(--flare);color:#fff;border-radius:14px;height:50px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.btn.dark{background:var(--mid)}.btn.ghost{background:#fff;color:var(--mid);border:1.5px solid var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--mid);color:#fff;border-color:var(--mid)}.chip.fl{background:#FFF0EA;color:var(--flare);border-color:#FFD5C4}
.search{height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:#9AA0B4}
.search svg{width:18px;height:18px}
.muted{color:var(--mute)}.small{font-size:12px}.b{font-weight:700}.fl{color:var(--flare)}
.between{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:#E7E9F1;border-radius:12px;padding:3px}.seg div{flex:1;text-align:center;padding:7px 0;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute)}.seg .on{background:#fff;color:var(--mid);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.av{border-radius:50%;background:linear-gradient(135deg,#C9CDE0,#A9AFC9);flex:none}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.ico{width:34px;height:34px;border-radius:10px;background:#F0F1F7;display:flex;align-items:center;justify-content:center;flex:none}.ico svg{width:18px;height:18px}
.map{position:relative;border-radius:18px;overflow:hidden;background:#E4EBE3;background-image:linear-gradient(#D3DCD2 2px,transparent 2px),linear-gradient(90deg,#D3DCD2 2px,transparent 2px),linear-gradient(35deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%),linear-gradient(-20deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%);background-size:44px 44px,44px 44px,100% 100%,100% 100%}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--flare);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pin.m{background:var(--mid)}
.me{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--violet);border:3px solid #fff;box-shadow:0 0 0 10px rgba(108,92,231,.18)}
.radius{position:absolute;border:2px dashed var(--violet);border-radius:50%;background:rgba(108,92,231,.07)}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:200px;height:200px;gap:0}
.qr i{display:block}.qr i.k{background:var(--mid)}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 0;text-align:center;font-weight:600;font-size:13px}
.slot.on{background:var(--flare);color:#fff;border-color:var(--flare)}.slot.x{color:#C2C6D4;background:#F3F4F8;text-decoration:line-through}
.day{flex:1;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center;padding:8px 0;font-size:11px;color:var(--mute);font-weight:600}
.day b{display:block;font-size:17px;color:var(--mid)}.day.on{background:var(--mid);border-color:var(--mid);color:#C9CDE0}.day.on b{color:#fff}
.lock{position:absolute;top:10px;right:10px;background:rgba(13,16,40,.75);color:#fff;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.lock svg{width:12px;height:12px}
.prod .ph{height:120px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat .n{font-size:30px;font-weight:800;margin-top:6px}.stat .d{font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}.pill.g{background:#E7F7EC;color:var(--ok)}.pill.o{background:#FFF0EA;color:var(--flare)}.pill.r{background:#FDECEC;color:#DC2626}.pill.v{background:#EEEBFF;color:var(--violet)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- icons (simple line icons) ----------
const P={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
dumbbell:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',
pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 14.2a5.5 5.5 0 0 1 6 5.8"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
cart:'<path d="M3 4h2l2.5 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="18" cy="19.5" r="1.5"/>',
heart:'<path d="M12 20s-8-4.8-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.2 12 20 12 20z"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
qr:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2"/>',
card:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor" stroke="none"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',post:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 15l4-4 4 4 3-3 5 5"/>',
cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/>',
truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'};
const ic=(n,c='currentColor',w=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const LOGO='../../brand/svg/';
// ---------- building blocks ----------
const sb=()=>`<div class="sb"><span>9:41</span><span>▪▪▪ 5G ▮</span></div>`;
const tabs=on=>`<div class="tabbar">${[['home','Home'],['dumbbell','Workouts'],['pin','Gyms'],['users','Trainers'],['user','Me']].map(([i,l])=>`<div class="tab ${l===on?'on':''}">${ic(i)}${l}</div>`).join('')}</div>`;
const phone=(inner,{tab,dark,bg}={})=>`<div class="phone"><div class="scr ${dark?'dark':''}" style="${bg?'background:'+bg:''}">${sb()}<div class="body">${inner}</div>${tab?tabs(tab):''}</div></div>`;
const cell=(n,label,ph,note)=>`<div class="cell"><div class="lab"><span>${n}</span>${label}</div>${ph}${note?`<div class="note">${note}</div>`:''}</div>`;
const topbar=(title,right='')=>`<div class="hdr"><h2>${title}</h2><div class="icons">${right}</div></div>`;
const ibtn=(i,b)=>`<div class="ib">${ic(i)}${b?`<span class="badge">${b}</span>`:''}</div>`;
const backbar=(t,r='')=>`<div class="between"><div class="ib">${ic('back')}</div><div class="b" style="font-size:16px">${t}</div>${r||'<div style="width:38px"></div>'}</div>`;
// deterministic QR-like pattern
function qr(){let s=7,h='';const rnd=()=>(s=(s*9301+49297)%233280)/233280;const finder=(r,c)=>{for(const [R,C] of [[0,0],[0,14],[14,0]]){const y=r-R,x=c-C;if(y>=0&&y<7&&x>=0&&x<7)return (y===0||y===6||x===0||x===6||(y>=2&&y<=4&&x>=2&&x<=4))?1:0;}return -1;};
 for(let r=0;r<21;r++)for(let c=0;c<21;c++){const f=finder(r,c);h+=`<i class="${(f===1||(f===-1&&rnd()>.52))?'k':''}"></i>`;}return `<div class="qr">${h}</div>`;}

// ================= BOARD 1: get started & join a gym =================
const DARKBG='radial-gradient(circle at 50% 30%,rgba(255,90,31,.28),transparent 45%),linear-gradient(160deg,#231B5E,#0D1028 60%)';
const frame=(inner)=>`<div style="flex:1;height:118px;border-radius:14px;background:${DARKBG};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden">${inner}</div>`;
const splashFrames=`<div style="display:flex;gap:8px;margin-top:12px">
 ${frame('<div style="width:12px;height:12px;border-radius:50%;background:var(--flare);box-shadow:0 0 16px var(--flare)"></div>')}
 ${frame(`<img src="${LOGO}bgym-mark-on-dark.svg" style="width:52px;opacity:.45;transform:scale(.8)">`)}
 ${frame(`<img src="${LOGO}bgym-mark-on-dark.svg" style="width:60px">`)}
 ${frame(`<img src="${LOGO}bgym-mark-on-dark.svg" style="width:52px"><img src="${LOGO}bgym-wordmark-on-dark.svg" style="height:12px">`)}</div>
 <div style="display:flex;gap:8px;font-size:11px;font-weight:700;color:var(--mute);margin-top:5px"><span style="flex:1;text-align:center">0.0s</span><span style="flex:1;text-align:center">0.4s</span><span style="flex:1;text-align:center">0.9s</span><span style="flex:1;text-align:center">1.4s</span></div>`;
const gIcon=`<span style="width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:conic-gradient(from -45deg,#EA4335 0 25%,#4285F4 0 50%,#34A853 0 75%,#FBBC05 0);-webkit-background-clip:text;color:transparent">G</span>`;
const aIcon=`<svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8C7 7.3 5.6 8.2 4.8 9.6c-1.6 2.8-.4 6.9 1.1 9.2.8 1.1 1.7 2.3 2.9 2.3 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-1.1 2.8-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.4-.9-2.4-3.7zM14.2 5.6c.6-.8 1.1-1.8.9-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3z"/></svg>`;
const storeBar=`<div style="position:absolute;left:14px;right:14px;bottom:82px;background:var(--mid);color:#fff;border-radius:18px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 10px 24px rgba(13,16,40,.35)">
 <div style="width:38px;height:38px;border-radius:12px;background:var(--flare);display:flex;align-items:center;justify-content:center;flex:none">${ic('bag','#fff')}</div>
 <div style="flex:1"><div class="b">BGYM Store</div><div class="small" style="opacity:.7">Supplements, apparel & equipment</div></div>
 <div class="chip" style="background:#fff;border:0;color:var(--mid)">Shop →</div></div>`;
const storePill=`<div style="position:absolute;right:14px;top:12px;background:#fff;border-radius:99px;padding:8px 13px 8px 10px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15)"><span style="width:18px;height:18px;display:inline-block">${ic('bag','#FF5A1F')}</span>Store</div>`;
const b1=[
cell(1,'Splash · animated logo',phone(`
 <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;gap:10px">
  <img src="${LOGO}bgym-mark-on-dark.svg" style="width:190px">
  <img src="${LOGO}bgym-wordmark-on-dark.svg" style="height:44px;margin-top:8px">
  <div style="opacity:.75;font-size:16px">Be my gym buddy.</div></div>
 <div style="display:flex;justify-content:center;gap:6px;margin-bottom:34px">${[1,.5,.25].map(o=>`<span style="width:8px;height:8px;border-radius:50%;background:var(--flare);opacity:${o}"></span>`).join('')}</div>`,
 {dark:1,bg:DARKBG}),
 `Shown when the app icon is tapped (about 1.6 s): the orange dot appears, the athlete rises in, the orbit ring draws around him, then the wordmark and tagline slide up. Then it fades into sign-in. <b>Animated version: <code>splash.html</code></b>.${splashFrames}`),
cell(2,'Sign in / sign up',phone(`
 <div style="text-align:center;margin-top:14px"><img src="${LOGO}bgym-mark.svg" style="width:96px;margin:0 auto"></div>
 <div style="text-align:center"><div class="b" style="font-size:24px">Welcome to BGYM</div><div class="muted">Sign in or create your account</div></div>
 <div class="btn" style="background:#000;gap:10px">${aIcon}Continue with Apple</div>
 <div class="btn ghost" style="gap:10px">${gIcon}Continue with Google</div>
 <div style="display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
 <div><div class="small b" style="margin-bottom:6px">Email</div><div class="search" style="color:var(--mid);font-weight:600">ama@example.com</div></div>
 <div class="btn">Continue with email</div>
 <div class="small muted" style="text-align:center;margin-top:auto;margin-bottom:6px">By continuing you agree to the Terms and Privacy Policy.</div>`),
 'One screen for both sign-in and sign-up. Apple, Google, or email with a one-time code (no passwords). Apple sign-in is required by the App Store when Google sign-in is offered.'),
cell(3,'Email code',phone(`
 ${backbar('')}
 <div style="width:58px;height:58px;border-radius:18px;background:#FFF0EA;display:flex;align-items:center;justify-content:center;margin-top:10px"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#FF5A1F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
 <div><div class="b" style="font-size:24px">Check your email</div><div class="muted" style="margin-top:4px">We sent a 6-digit code to <span class="b" style="color:var(--mid)">ama@example.com</span></div></div>
 <div style="display:flex;gap:8px">${['4','8','2','1','',''].map((d,i)=>`<div style="flex:1;height:58px;border-radius:14px;background:#fff;border:${i===4?'2px solid var(--flare)':'1.5px solid var(--line)'};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800">${d}</div>`).join('')}</div>
 <div class="small muted">Didn't get it? <span class="b">Resend in 0:42</span> · check your spam folder</div>
 <div class="btn" style="margin-top:auto">Verify</div><div class="small muted" style="text-align:center;margin-bottom:6px">Wrong email? <span class="b fl">Change it</span></div>`),
 'The code expires after 10 minutes. New users then add their name, optional photo and fitness goal before location.'),
cell(4,'Location & radius',phone(`
 ${backbar('Find gyms near you')}
 <div class="map" style="height:262px">
  <div class="radius" style="left:50px;top:21px;width:220px;height:220px"></div><div class="me" style="left:152px;top:123px"></div>
  ${[[78,60],[196,40],[226,150],[110,190],[160,80]].map(([x,y])=>`<div class="pin" style="left:${x}px;top:${y}px"></div>`).join('')}
  <div class="pin m" style="left:20px;top:220px"></div><div class="pin m" style="left:285px;top:20px"></div></div>
 <div class="card" style="display:flex;gap:10px;align-items:center"><div class="ico" style="background:#EEEBFF">${ic('target','#6C5CE7')}</div><div><div class="b">East Legon, Accra</div><div class="small muted">Using your current location · Change</div></div></div>
 <div><div class="b" style="margin-bottom:8px">Search radius</div><div class="chips">${['1 km','3 km','5 km','10 km','20 km'].map(k=>`<div class="chip ${k==='5 km'?'on':''}">${k}</div>`).join('')}</div></div>
