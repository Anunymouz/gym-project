<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGYM Splash</title>
<style>
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-latin-500-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-latin-700-normal.woff2)}
:root{--mid:#0D1028;--flare:#FF5A1F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#E9EBF2;font-family:Outfit,system-ui,sans-serif;padding:16px}
.phone{width:360px;max-width:100%;height:760px;border-radius:46px;background:#0B0D1C;padding:10px;box-shadow:0 24px 50px rgba(13,16,40,.28)}
.scr{position:relative;height:100%;border-radius:37px;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(255,90,31,.28),transparent 45%),linear-gradient(160deg,#231B5E,#0D1028 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.mk{width:200px;overflow:visible}
.mk>g>circle{transform-box:fill-box;transform-origin:center;animation:dot .5s cubic-bezier(.3,1.6,.5,1) both}
.mk>g>g{transform-box:fill-box;transform-origin:50% 100%;animation:rise .55s .3s cubic-bezier(.2,.9,.3,1.15) both}
.mk .ring{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .7s ease-out forwards}
.mk .ring:last-of-type{animation-delay:.85s}
.wm{height:46px;margin-top:22px;animation:up .45s 1.1s ease-out both}
.tag{margin-top:12px;font-size:17px;opacity:.75;animation:up .45s 1.3s ease-out both}
.fade{position:absolute;inset:0;background:#F5F6FA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mid);opacity:0;animation:out .5s 2.4s ease-in forwards}
.fade b{font-size:22px}.fade span{color:#6B7280}
@keyframes dot{from{transform:scale(0);filter:drop-shadow(0 0 0 var(--flare))}60%{filter:drop-shadow(0 0 8px var(--flare))}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.82)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes out{to{opacity:1}}
button{font:700 15px Outfit,sans-serif;background:var(--mid);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
p{margin:0;color:#6B7280;font-size:14px;text-align:center;max-width:360px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>
